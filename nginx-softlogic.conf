# ==============================================================================
# Nginx Configuration Snippet for ai.loopsintegrated.co/softlogic
# Include this block inside your server { ... } block for ai.loopsintegrated.co
# ==============================================================================

# 1. Enforce trailing slash on /softlogic -> /softlogic/
location = /softlogic {
    return 301 https://$host/softlogic/;
}

# 2. Subpath static hosting for /softlogic/
location /softlogic/ {
    # Adjust alias path to your server's folder location:
    alias /var/www/softlogic/;
    index index.html;
    try_files $uri $uri/ /softlogic/index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MP4 & WebM byte-range video streaming support
    location ~* ^/softlogic/.*\.(mp4|webm)$ {
        alias /var/www/softlogic/;
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Static assets caching (CSS, JS, Images, Fonts)
    location ~* ^/softlogic/.*\.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        alias /var/www/softlogic/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
